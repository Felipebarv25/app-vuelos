<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Anduve">
  <!-- Fondo redondeado estilo iOS app icon (rx ~22%) -->
  <rect width="200" height="200" rx="44" fill="#0c5f58"/>

  <!-- Planeta: cúpula recortada (solo la parte superior visible dentro del viewBox).
       Centro en y=212 y radio 140 deja solo el horizonte arriba (mismo que el ícono completo). -->
  <defs>
    <clipPath id="anduveDome"><rect x="-20" y="-20" width="240" height="170"/></clipPath>
  </defs>
  <g clip-path="url(#anduveDome)">
    <!-- Cúpula del planeta con tinte sutil -->
    <circle cx="100" cy="212" r="140" fill="rgba(255,255,255,0.10)" stroke="#ffffff" stroke-width="3"/>

    <!-- Edificios a la izquierda (skyline simplificado) -->
    <g fill="#ffffff">
      <rect x="63" y="62" width="9" height="22" rx="1"/>
      <rect x="74" y="55" width="10" height="29" rx="1"/>
      <rect x="86" y="68" width="8" height="16" rx="1"/>
    </g>

    <!-- Sydney opera (montículos a la derecha) -->
    <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M118 84 L132 60 L146 84"/>
      <path d="M138 84 L150 67 L156 84"/>
      <path d="M127 65 L132 60 L137 65"/>
    </g>
  </g>

  <!-- Walker estático centrado (silueta blanca, mochila coral) -->
  <g fill="#ffffff" stroke="none">
    <!-- pierna trasera -->
    <path d="M98.3 56 L101.7 56 L101.3 64.5 L98.7 64.5 Z"/>
    <path d="M98.5 64 L101.5 64 L101.3 71 L98.7 71 L98.7 73 L105.3 73 L105.3 71.2 L101.3 70.5 Z"/>
    <!-- pierna delantera (ligeramente adelantada) -->
    <g transform="rotate(8 100 56)">
      <path d="M98.3 56 L101.7 56 L101.3 64.5 L98.7 64.5 Z"/>
      <path d="M98.5 64 L101.5 64 L101.3 71 L98.7 71 L98.7 73 L105.3 73 L105.3 71.2 L101.3 70.5 Z"/>
    </g>
    <!-- torso + brazo + cabeza, con leve inclinación (sway) -->
    <g transform="rotate(-10 100 56)">
      <!-- brazo trasero -->
      <path d="M98.7 41 L101.3 41 L100.7 63 L99.3 63 Z"/>
      <!-- mochila coral -->
      <rect x="89" y="43.5" width="8" height="11" rx="3" fill="#f4734d"/>
      <rect x="94.4" y="42.5" width="1.9" height="10" rx="0.9" fill="#f4734d"/>
      <!-- torso -->
      <path d="M97.7 40.5 C97.7 38.2 103.1 38.2 103.1 40.5 L104 54 L102.7 61 L100.7 57.8 L100.1 57.8 L98.1 61 L96.8 54 Z"/>
      <!-- brazo delantero -->
      <g transform="rotate(20 100 41)">
        <path d="M98.7 41 L101.3 41 L100.7 63 L99.3 63 Z"/>
      </g>
      <!-- cabeza + pelo -->
      <circle cx="100.4" cy="32.5" r="5.2"/>
      <path d="M104.5 31.1 Q106.7 31.5 106.6 32.6 Q106.5 33.7 104.5 34.1 Z"/>
      <path d="M95.3 33 Q94.9 26.4 100.4 26.4 Q105.9 26.4 105.5 33 Q104 30.1 101 30.5 Q97.6 30.9 95.3 33 Z"/>
    </g>
  </g>
</svg>
