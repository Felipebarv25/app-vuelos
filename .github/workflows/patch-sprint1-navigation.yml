name: Patch Sprint 1 navigation
on:
  push:
    branches: [sprint1-mi-viaje]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: conectar Abrir viaje con Mi viaje'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint1-mi-viaje
          fetch-depth: 0
      - name: Patch navigation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'web/app/mis-viajes/page.js';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('import { useRouter } from "next/navigation";', 'import { useRouter, useSearchParams } from "next/navigation";');
          const a = '  const router = useRouter();\n  const [viajes, setViajes] = useState([]);';
          const b = '  const router = useRouter();\n  const searchParams = useSearchParams();\n  const editarId = searchParams.get("editar");\n  const [viajes, setViajes] = useState([]);';
          if (!s.includes(a)) throw new Error('state anchor not found');
          s = s.replace(a, b);
          const c = '  useEffect(() => { cargarRutas(); }, [cargarRutas, usuario]);';
          const d = `  useEffect(() => { cargarRutas(); }, [cargarRutas, usuario]);\n\n  useEffect(() => {\n    if (!editarId || !rutas.length) return;\n    const ruta = rutas.find((r) => String(r.id) === String(editarId));\n    if (ruta) {\n      setRutaAbierta(ruta);\n      setModoPlan("manual");\n    }\n  }, [editarId, rutas]);`;
          if (!s.includes(c)) throw new Error('effect anchor not found');
          s = s.replace(c, d);
          const e = '                onAbrir={(r) => setRutaAbierta(r)}';
          const f = '                onAbrir={(r) => r?.id ? router.push(`/mi-viaje?id=${encodeURIComponent(r.id)}`) : setRutaAbierta(r)}';
          if (!s.includes(e)) throw new Error('open anchor not found');
          s = s.replace(e, f);
          fs.writeFileSync(p, s);
          NODE
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/mis-viajes/page.js .github/workflows/patch-sprint1-navigation.yml
          git commit -m "fix: conectar Abrir viaje con Mi viaje"
          git push
