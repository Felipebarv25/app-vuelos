name: Detector de vuelos

on:
  schedule:
    # Cada hora (2026-07-18, antes cada 3h): el repo es publico asi que los
    # minutos de Actions son gratis. Nota: el cron de GitHub puede correr con
    # unos minutos de retraso en horas pico — es normal.
    - cron: "0 * * * *"
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write           # para guardar el historial de precios actualizado

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      # Actualizadas a las versiones con Node 22 (las v4/v5 corrian sobre
      # Node 20 ya deprecado en GitHub Actions).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar detector
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          # Secret compartido para POSTear al endpoint Vercel /api/alertas/disparar
          # Debe coincidir con ALERTS_SHARED_SECRET en Vercel env vars.
          ALERTS_SHARED_SECRET: ${{ secrets.ALERTS_SHARED_SECRET }}
        run: python detector.py

      - name: Generar ofertas para la web
        run: python generar_ofertas.py

      - name: Guardar historial y ofertas actualizados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add datos/ web/public/ofertas.json web/public/historial-resumen.json
          git commit -m "Actualizar historial y ofertas de vuelos" || echo "Sin cambios"
          # Race-safe push: si hubo commits manuales mientras el detector
          # corria (el caso comun cuando estoy pusheando codigo en paralelo),
          # rebaseamos sobre main antes de pushear. --autostash maneja
          # cambios locales no commiteados. Hasta 3 intentos en caso de
          # carreras consecutivas.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Intento $i fallido, reintentando en 10s..."
            sleep 10
          done
          echo "ERROR: no se pudo pushear despues de 3 intentos"
          exit 1
