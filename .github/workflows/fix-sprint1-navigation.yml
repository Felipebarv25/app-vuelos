name: Fix Sprint 1 navigation

on:
  push:
    branches: [sprint1-mi-viaje]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: conectar lista de viajes con Mi viaje'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint1-mi-viaje
          fetch-depth: 0

      - name: Patch navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/app/mis-viajes/page.js')
          s = p.read_text(encoding='utf-8')

          old = 'import { useRouter } from "next/navigation";'
          new = 'import { useRouter, useSearchParams } from "next/navigation";'
          if old not in s:
              raise SystemExit('import target not found')
          s = s.replace(old, new, 1)

          old = '  const router = useRouter();\n  const [viajes, setViajes] = useState([]);'
          new = '  const router = useRouter();\n  const searchParams = useSearchParams();\n  const editarId = searchParams.get("editar");\n  const [viajes, setViajes] = useState([]);'
          if old not in s:
              raise SystemExit('state target not found')
          s = s.replace(old, new, 1)

          old = '  useEffect(() => { cargarRutas(); }, [cargarRutas, usuario]);'
          new = '''  useEffect(() => { cargarRutas(); }, [cargarRutas, usuario]);

  useEffect(() => {
    if (!editarId || !rutas.length) return;
    const ruta = rutas.find((r) => String(r.id) === String(editarId));
    if (ruta) setRutaAbierta(ruta);
  }, [editarId, rutas]);'''
          if old not in s:
              raise SystemExit('effect target not found')
          s = s.replace(old, new, 1)

          old = '                onAbrir={(r) => setRutaAbierta(r)}'
          new = '                onAbrir={(r) => r?.id ? router.push(`/mi-viaje?id=${encodeURIComponent(r.id)}`) : setRutaAbierta(r)}'
          if old not in s:
              raise SystemExit('open target not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/mis-viajes/page.js .github/workflows/fix-sprint1-navigation.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: conectar lista de viajes con Mi viaje"
          git rm .github/workflows/fix-sprint1-navigation.yml
          git commit -m "chore: retirar workflow temporal de parche"
          git push