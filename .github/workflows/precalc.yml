# Regenera los lugares precalculados (web/public/lugares/*.json + precalcIndex)
# en la nube — donde SI hay Node — y commitea el resultado. Correr tras ampliar
# la lista de ciudades en web/scripts/precomputar-lugares.mjs, o esperar al
# cron mensual (los datos de OSM/Wikidata mejoran con el tiempo).
#
# Disparo manual: GitHub -> Actions -> "precalcular lugares" -> Run workflow.
name: precalcular lugares

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *" # 1ro de cada mes, 06:00 UTC

permissions:
  contents: write

jobs:
  precalc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar lugares precalculados (~200 ciudades)
        working-directory: web
        run: node scripts/precomputar-lugares.mjs

      - name: Commit y push (race-safe con el detector)
        run: |
          git config user.name "anduve-precalc"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/lugares web/lib/precalcIndex.js
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
            exit 0
          fi
          git commit -m "precalc: regenerar lugares precalculados (workflow)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "Push fallo (intento $i), reintentando..."
            sleep 10
          done
          exit 1
