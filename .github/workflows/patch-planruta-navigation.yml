name: Patch PlanRuta navigation
on:
  push:
    branches: [sprint1-mi-viaje]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: abrir viaje desde lista'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint1-mi-viaje
          fetch-depth: 0
      - name: Patch PlanRuta
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'web/components/PlanRuta.js';
          let s = fs.readFileSync(p, 'utf8');
          const anchor = '}) {\n  // Qué se carga al abrir, y bajo qué identidad local se guarda.';
          const patch = `}) {\n  // Una ruta guardada se gestiona en "/mi-viaje". El editor solo debe abrirse\n  // cuando el usuario llega explícitamente con ?editar=. Esto mantiene una\n  // sola fuente de verdad para el dashboard y evita que "Abrir" vuelva al\n  // formulario antiguo.\n  useEffect(() => {\n    if (!rutaInicial?.id || typeof window === "undefined") return;\n    if (window.location.pathname !== "/mis-viajes") return;\n    const params = new URLSearchParams(window.location.search);\n    if (params.get("editar")) return;\n    window.location.replace(\n      \`/mi-viaje?id=\${encodeURIComponent(rutaInicial.id)}\`,\n    );\n  }, [rutaInicial?.id]);\n\n  // Qué se carga al abrir, y bajo qué identidad local se guarda.`;
          if (!s.includes(anchor)) throw new Error('PlanRuta anchor not found');
          s = s.replace(anchor, patch, 1);
          fs.writeFileSync(p, s);
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/components/PlanRuta.js .github/workflows/patch-planruta-navigation.yml
          git commit -m "fix: abrir viaje desde lista"
          git push
